# ==============================================================================
# backup.conf — Configuration & Sane Defaults
# "Convention over configuration. Edit only what is necessary."
# ==============================================================================

# Destination repository for archives (Task 1)
# Defaults to /backup (can be overridden by setting LIFERAFT_DEST in environment)
BACKUP_DEST="${LIFERAFT_DEST:-/backup}"

# Target directories to protect (Task 2)
# Saves critical system configuration and personal user directories
if [[ -n "${LIFERAFT_SOURCES:-}" ]]; then
    read -r -a BACKUP_SOURCES <<< "$LIFERAFT_SOURCES"
elif [[ -z "${BACKUP_SOURCES+x}" ]]; then
    BACKUP_SOURCES=(
        "/etc"
        "/home"
    )
fi

# Retention threshold in days (Task 6)
# Safely prunes archives older than this number of days
RETENTION_DAYS="${LIFERAFT_RETENTION_DAYS:-7}"

# Central execution log file (Task 4)
LOG_FILE="${BACKUP_DEST}/backup.log"

# Archive naming prefix
# Produces: backup-YYYY-MM-DD_HHMMSS.tar.gz (Task 3)
ARCHIVE_PREFIX="backup"

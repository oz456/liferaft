# ==============================================================================
# backup.conf — Simple Settings
# ==============================================================================

# Where backups are saved (Task 1)
BACKUP_DEST="/backup"

# What to backup (Task 2)
BACKUP_SOURCES=("/etc" "/home")

# How many days to keep backups (Task 6)
RETENTION_DAYS=7

# Where to write logs (Task 4)
LOG_FILE="/backup/backup.log"

# ==============================================================================
# liferaft.conf — Opinionated Defaults for the Discerning Sysadmin
# "Convention over configuration. Change these only if your server has eccentricities."
# ==============================================================================

# Destination vault for archives (Task 1)
# Defaults to /backup, overridable via LIFERAFT_DEST for local testing/sandboxing
BACKUP_DEST="${LIFERAFT_DEST:-/backup}"

# Target directories to protect (Task 2)
# Preserves system config and user personal files
if [[ -n "${LIFERAFT_SOURCES:-}" ]]; then
    read -r -a BACKUP_SOURCES <<< "$LIFERAFT_SOURCES"
elif [[ -z "${BACKUP_SOURCES+x}" ]]; then
    BACKUP_SOURCES=(
        "/etc"
        "/home"
    )
fi

# Retention policy threshold (Task 6)
# Safely prunes archives strictly older than 7 days
RETENTION_DAYS="${LIFERAFT_RETENTION_DAYS:-7}"

# The operational ledger (Task 4)
LOG_FILE="${BACKUP_DEST}/liferaft.log"

# Archive naming metadata (Task 3)
# Produces: liferaft-YYYY-MM-DD_HHMMSS.tar.gz
ARCHIVE_PREFIX="liferaft"
COMPRESSION_EXT="tar.gz"
